# Org-wide deployment: Qdrant + the MCP server + Caddy for automatic TLS.
#
#   cp deploy/.env.example deploy/.env    # fill in DOMAIN and the two secrets
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Then load the index once (from a machine with the chunks):
#   QDRANT_URL=https://<domain>:6333 QDRANT_API_KEY=... python scripts/ingest_qdrant.py --recreate
#
# Qdrant is NOT published to the host here -- it is reachable only on the
# internal compose network. Publish it temporarily, or tunnel over SSH, when you
# need to ingest.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in deploy/.env}
    healthcheck:
      test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 12

  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in deploy/.env}
      MCP_PUBLIC_URL: https://${DOMAIN:?set DOMAIN in deploy/.env}
      RAG_RERANK: ${RAG_RERANK:-1}
    volumes:
      # model weights (~2.8 GB) land here on first run and survive rebuilds
      - model_cache:/models

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - mcp
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  qdrant_storage:
  model_cache:
  caddy_data:
  caddy_config:
